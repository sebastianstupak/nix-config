# sops-nix creation rules. See secrets/README.md for the full workflow.
#
# BEFORE you can create a secret, replace the placeholder recipient below with a
# real age public key:
#
#   # from your user SSH key:
#   nix run nixpkgs#ssh-to-age -- -i ~/.ssh/id_ed25519.pub
#   # or from the host key (after install, matches modules/nixos/core.nix):
#   nix run nixpkgs#ssh-to-age -- -i /etc/ssh/ssh_host_ed25519_key.pub
#
# Then create/edit an encrypted file with:  sops secrets/secrets.yaml

keys:
  - &workstation age1PLACEHOLDER_replace_with_output_of_ssh_to_age

creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *workstation
