# sops-nix creation rules. See secrets/README.md for the full workflow.
#
# Three age recipients. Which of them a file gets depends on its path — see
# the creation rules at the bottom.
#
#   zagreus      derived from the HOST key /etc/ssh/ssh_host_ed25519_key on the
#                AMD HP laptop. sops-nix decrypts as root during activation,
#                using sops.age.sshKeyPaths in modules/nixos/core.nix — so
#                without its recipient a machine cannot read its own secrets at
#                boot.
#
#   hestia       the HP ZBook Firefly 14 G10 (Intel i7-1355U), which used to
#                boot the shared `workstation` entry and now has hosts/hestia/.
#                Same derivation, different host key. This anchor was called
#                `workstation_intel` until the machine got a name of its own;
#                renaming an anchor changes no key material.
#                This recipient is why it can read passwords.yaml at all: the
#                first install of that machine had only the recipient above, so
#                hashedPasswordFile never appeared, and update-users-groups.pl
#                wrote "!" into every shadow entry on each activation — locking
#                both sebastianstupak and root out with no way back in. If you
#                ever reinstall either machine, its host key is regenerated:
#                re-derive the value here and run `sops updatekeys` BEFORE the
#                first boot, or you will reproduce exactly that lockout.
#
#   sebastianstupak  a standalone age key at ~/.config/sops/age/keys.txt, which
#                    sops finds on its own. Without a second recipient you could
#                    create a secret and never reopen it: `sops secrets/...`
#                    runs as you and cannot read the root-owned host key.
#
# Deliberately NOT derived from ~/.ssh/id_ed25519: that key is passphrase-
# protected, and ssh-to-age cannot decrypt it (no passphrase support), so an
# ssh-derived recipient would encrypt to a key nothing can use. Verified — sops
# cannot consume the ssh key as an age identity either.
#
# Age recipients are public keys — safe to commit. Re-derive with:
#   nix run nixpkgs#ssh-to-age -- -i /etc/ssh/ssh_host_ed25519_key.pub
#   grep 'public key' ~/.config/sops/age/keys.txt
#
# Note the host key is regenerated by a reinstall: rotate this value and run
# `sops updatekeys secrets/<file>` afterwards, or the machine loses access.
#
# Create/edit an encrypted file with:  sops secrets/secrets.yaml

keys:
  - &zagreus age14q4wp2reca4znhzeljj862kps7h6g4zz5z8ls84jp5m34ha7kd6qy2njex
  - &hestia age1attpxxmnvhnfrfqgmwt7vtyn4ax9d0274lqzfaymt57zs5894p5s0tck3f
  - &sebastianstupak age16x0azpketkfava5fcfjzvhjrmv43pujsgnyj5x27zlqvsl0d7dmsdqd4mp

# Ordered, and ORDER MATTERS: sops takes the FIRST matching rule, so the
# per-host paths have to precede the catch-all or everything would be
# encrypted to every machine again.
#
# A host's own directory is encrypted to that host and to you, and NOT to the
# other machine. That is the point: a stolen laptop can read the hash it
# already had to have, and not the other machine's. The cost is that your
# standalone age key becomes the only way to re-key a reinstalled host from
# elsewhere, which is why secrets/README.md insists it lives off-machine.
#
# secrets/common/ stays readable by every machine, because it has to be: the
# restic credentials are used by all of them.
creation_rules:
  - path_regex: secrets/zagreus/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *zagreus
          - *sebastianstupak

  - path_regex: secrets/hestia/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *hestia
          - *sebastianstupak

  - path_regex: secrets/common/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *zagreus
          - *hestia
          - *sebastianstupak

  # Catch-all for a file dropped straight into secrets/. Encrypted to
  # everything, so a stray file is never LESS readable than intended — but put
  # new files in common/ or a host directory rather than relying on this.
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *zagreus
          - *hestia
          - *sebastianstupak
